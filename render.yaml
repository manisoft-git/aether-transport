services:
  - type: web
    name: manisoft-aether-transport
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt 2>/dev/null || true"
    startCommand: "python3 server.py"
    envVars:
      - key: PORT
        value: 10000
      - key: PROTOCOL_ENV
        value: production
